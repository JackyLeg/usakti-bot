services:
  backend:
    build: ./backend
    container_name: usakti-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    container_name: usakti-bot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: usakti-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

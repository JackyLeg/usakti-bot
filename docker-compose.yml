services:
  backend:
    build: ./backend
    container_name: usakti-bot
    restart: unless-stopped
    ports:
      - "5005:8000"
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - fastembed_cache:/app/fastembed_cache
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    container_name: usakti-bot-qdrant
    restart: unless-stopped
    # remove ports when release to univ server
    # ports:
    #   - "6333:6333"

    volumes:
      - ./qdrant_storage:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: usakti-bot-redis
    restart: unless-stopped
    # remove ports when release to univ server
    # ports:
    #   - "6379:6379"

    volumes:
      - ./redis_data:/data

volumes:
  qdrant_data:
  fastembed_cache:
